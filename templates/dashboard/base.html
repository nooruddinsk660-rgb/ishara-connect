<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ishara-Connect — Caregiver Dashboard{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
    <script>
        // Applied before paint (not after DOMContentLoaded) to avoid a flash
        // of the wrong theme on load. Real localStorage, not an artifact --
        // this is deployed application code, not a claude.ai chat artifact.
        (function () {
            var saved = localStorage.getItem('ishara-dashboard-theme');
            if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    {% block head %}{% endblock %}
</head>
<body>
    {% if user %}
    <header class="dash-header">
        <a class="dash-brand" href="{{ url_for('dashboard.home') }}">
            <i class="fa-solid fa-hand-holding-heart"></i> Ishara<span>Connect</span>
        </a>
        <div class="dash-header-right">
            <div class="dash-institution">
                <i class="fa-solid fa-hospital"></i> {{ institution.name if institution else '' }}
            </div>
            <button id="dash-theme-toggle" class="dash-icon-btn" onclick="toggleDashTheme()" aria-label="Switch between dark and light theme" title="Toggle theme">
                <i class="fa-solid fa-sun" id="dash-theme-icon"></i>
            </button>
            <div class="dash-user">
                <div class="dash-user-avatar">{{ (user.name or user.email or '?')[0]|upper }}</div>
                <div class="dash-user-meta">
                    <span class="dash-user-name">{{ user.name or user.email }}</span>
                    <span class="dash-user-role">{{ user.role }}</span>
                </div>
            </div>
            <a class="dash-logout" href="{{ url_for('dashboard.logout') }}" aria-label="Log out" title="Log out"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
        </div>
    </header>
    {% endif %}
    <main class="dash-main">
        {% block content %}{% endblock %}
    </main>
    <script>
        function toggleDashTheme() {
            var html = document.documentElement;
            var isLight = html.getAttribute('data-theme') === 'light';
            var next = isLight ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('ishara-dashboard-theme', next);
            var icon = document.getElementById('dash-theme-icon');
            if (icon) icon.className = next === 'light' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }
        // Set the correct icon on load to match whatever the inline script
        // above already applied to <html>, before any user interaction.
        (function () {
            var icon = document.getElementById('dash-theme-icon');
            if (icon && document.documentElement.getAttribute('data-theme') === 'light') {
                icon.className = 'fa-solid fa-moon';
            }
        })();
    </script>
</body>
</html>
