<div class="main-container">
    <!-- Camera Stage Card (Left / Main Hero) -->
    <div class="stage-card">
        <!-- Captures local device camera, stays hidden -->
        <video id="local_video" autoplay playsinline muted style="display:none;"></video>
        <!-- Canvas used to encode frame to base64 -->
        <canvas id="hidden_canvas" style="display:none;"></canvas>
        <!-- Displays the ML processed stream emitted from Flask. object-fit: contain --
             never crops. A sign-language app cropping the frame means losing the sign. -->
        <img id="video_feed" src="" alt="Webcam Feed">

        <div class="viewfinder" aria-hidden="true">
            <span class="vf-corner vf-tl"></span>
            <span class="vf-corner vf-tr"></span>
            <span class="vf-corner vf-bl"></span>
            <span class="vf-corner vf-br"></span>
        </div>

        <!-- Large HD Sign Language Avatar Interpreter (PiP on Stage) -->
        <div class="avatar-pip" id="avatar-pip" aria-live="polite">
            <div class="pip-header">
                <span class="pip-badge"><i class="fas fa-hands-asl-interpreting"></i> ISL Signer</span>
                <span class="pip-caption" id="avatar-caption">Sign Interpreter</span>
                <button class="pip-close-btn" type="button" onclick="closeAvatarPip()" title="Hide Signer">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
            <div class="pip-video-wrap">
                <video id="avatar-video" playsinline webkit-playsinline muted preload="auto"></video>
                <div class="pip-idle-overlay" id="avatar-idle-icon">
                    <i class="fas fa-hands"></i>
                    <span>Waiting for reply...</span>
                </div>
            </div>
        </div>

        <div class="caption-bar" id="caption-bar">
            <div class="confidence-ring" id="confidence-ring">
                <svg viewBox="0 0 44 44" aria-hidden="true">
                    <circle class="ring-track" cx="22" cy="22" r="19"></circle>
                    <circle class="ring-fill" id="ring-fill" cx="22" cy="22" r="19"></circle>
                </svg>
                <span class="ring-pct" id="ring-pct"></span>
            </div>
            <div class="caption-text">
                <div class="label-small">Detected Sign</div>
                <div id="pred-text">...</div>
                <div id="sent-text">Waiting for sign...</div>
            </div>
        </div>
    </div>

    <!-- Conversation Card (Right) with Integrated Listen / Show Sign Panel -->
    <div class="convo-card">
        <div class="convo-header">
            <i class="fas fa-comments"></i> Conversation
            <span class="convo-count" id="convo-count">0</span>
        </div>

        <div class="convo-log" id="convo-log">
            <div class="convo-empty" id="convo-empty">
                Signed words and spoken replies will appear here as the conversation happens.
            </div>
        </div>

        <!-- Integrated Reply Panel under Conversation messages -->
        <div class="reply-card">
            <div class="reply-tabs" role="tablist">
                <button class="reply-tab is-active" id="tab-listen" type="button" role="tab"
                        aria-selected="true" aria-controls="panel-listen" onclick="switchReplyTab('listen')">
                    <i class="fas fa-microphone"></i> Listen
                </button>
                <button class="reply-tab" id="tab-avatar" type="button" role="tab"
                        aria-selected="false" aria-controls="panel-avatar" onclick="switchReplyTab('avatar')">
                    <i class="fas fa-hands"></i> Show Sign
                </button>
            </div>

            <!-- "Listen to Reply" panel -->
            <div class="reply-panel" id="panel-listen" role="tabpanel" aria-labelledby="tab-listen">
                <button id="listen-btn" class="neumorphic-btn" onclick="toggleListening()">
                    <i class="fas fa-microphone"></i> &nbsp; Listen to Reply
                </button>
                <div id="incoming-text" class="incoming-text">Waiting for reply...</div>
            </div>

            <!-- "Show Sign" Avatar Quick-Reply panel -->
            <div class="reply-panel" id="panel-avatar" role="tabpanel" aria-labelledby="tab-avatar" hidden>
                <div class="avatar-quick-label">Tap any phrase to sign on the main screen:</div>
                <div class="avatar-quick-replies">
                    {% for r in avatar_replies %}
                    <button class="avatar-reply-btn{{ '' if r.available else ' is-coming-soon' }}"
                            data-key="{{ r.key }}"
                            data-label="{{ r.label }}"
                            {% if r.available %}
                            data-video="{{ url_for('static', filename='avatar/' + r.video) }}"
                            data-poster="{{ url_for('static', filename='avatar/' + r.poster) }}"
                            onclick="playAvatarReply(this)"
                            {% else %}
                            disabled
                            {% endif %}
                            title="{{ r.label if r.available else r.label + ' — recording coming soon' }}">
                        <i class="fas {{ r.icon }}"></i>
                        <span>{{ r.label }}</span>
                        {% if not r.available %}<span class="soon-badge">Soon</span>{% endif %}
                    </button>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
