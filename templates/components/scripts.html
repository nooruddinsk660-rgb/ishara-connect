<!-- Load Socket.IO client library (Local static first, CDN fallback) -->
<script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
<script>
    if (typeof io === 'undefined') {
        document.write('<script src="https://cdn.socket.io/4.6.0/socket.io.min.js"><\/script>');
    }
</script>

<script id="avatar-replies-data" type="application/json">
    {{ (avatar_replies if avatar_replies is defined else []) | tojson | safe }}
</script>

<script>
    // --- Global States ---
    const avatarRepliesEl = document.getElementById('avatar-replies-data');
    window.AVATAR_REPLIES = avatarRepliesEl ? JSON.parse(avatarRepliesEl.textContent || '[]') : [];
    let isPoliteMode = false;
    let isMuted = false;
    let isCameraOn = true;
    let lastPlayedAudioUrl = "";
    let selectedLang = 'english';
    let socket = null;
    let localStream = null;
    let cameraInterval = null;
    let isFrameProcessing = false;
    let frameWatchdogTimer = null;

    // --- Audio Manager ---
    const AppManager = {
        isAudioPlaying: false,
        wasMicActiveBeforeAudio: false,
        audioCache: {},

        preloadAudio: function () {
            // Preload common polite greetings
            const common = [
                '/static/audio/bengali_polite/hello_polite.mp3',
                '/static/audio/hindi_polite/hello_polite.mp3',
                '/static/audio/english_polite/hello_polite.mp3'
            ];
            common.forEach(url => {
                const audio = new Audio();
                audio.src = url;
                this.audioCache[url] = audio;
            });
            console.log("⬇️ Audio Preloaded");
        },

        playAudio: function (url) {
            if (isMuted || this.isAudioPlaying) return;

            console.log("🔊 Playing audio:", url);
            this.isAudioPlaying = true;

            // Stop Mic if it's running to avoid self-loop
            if (SpeechManager.isListening) {
                this.wasMicActiveBeforeAudio = true;
                SpeechManager.stopListening();
            }

            const audio = new Audio(url);

            audio.onended = () => {
                this.isAudioPlaying = false;
                lastPlayedAudioUrl = "";
                // Auto-resume mic if it was active?
                // UX Decision: Typically users want to reply after hearing, so manual toggle is safer 
                // to avoid picking up echo, but we can auto-resume if desired. 
                // For now, let's keep it manual or auto-resume with delay.
                if (this.wasMicActiveBeforeAudio) {
                    this.wasMicActiveBeforeAudio = false;
                    // setTimeout(() => SpeechManager.startListening(), 500); // Optional Auto-Resume
                }
            };

            audio.onerror = (e) => {
                console.error("❌ Audio playback failed:", e);
                this.isAudioPlaying = false;
            };

            audio.play().catch(e => {
                console.warn("⚠️ Autoplay blocked:", e);
                this.isAudioPlaying = false;
            });
        },

        showEmergencyConfirmation: function (triggerPhrase, severity) {
            // Built dynamically rather than living in every template's HTML --
            // this only needs to exist the moment it's used.
            let overlay = document.getElementById('emergency-confirm-overlay');
            if (overlay) overlay.remove(); // replace if one's already fading out

            overlay = document.createElement('div');
            overlay.id = 'emergency-confirm-overlay';
            overlay.className = 'emergency-confirm-overlay sev-' + severity;
            overlay.innerHTML =
                '<i class="fa-solid fa-triangle-exclamation"></i>' +
                '<span class="emergency-confirm-title">Alert sent to your care team</span>' +
                '<span class="emergency-confirm-sub">"' + triggerPhrase + '" — someone has been notified</span>';
            document.body.appendChild(overlay);

            requestAnimationFrame(() => overlay.classList.add('is-visible'));

            setTimeout(() => {
                overlay.classList.remove('is-visible');
                setTimeout(() => overlay.remove(), 500);
            }, 4000);
        }
    };

    // --- Speech Recognition Manager (World Class Refactor) ---
    const SpeechManager = {
        recognition: null,
        isListening: false,
        finalTranscript: '',
        lastSpokenText: '',

        init: function () {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                this.recognition = new SpeechRecognition();
                this.recognition.continuous = false; // We want single command/sentence flow
                this.recognition.interimResults = true; // Show text AS you speak
                this.recognition.maxAlternatives = 1;

                this.setupListeners();
            } else {
                console.error("❌ Speech Recognition Not Supported in this Browser.");
                alert("Speech Recognition is not supported in this browser. Please use Chrome.");
                const btn = document.getElementById('listen-btn');
                if (btn) btn.style.display = 'none';
            }
        },

        setupListeners: function () {
            if (!this.recognition) return;

            this.recognition.onstart = () => {
                this.isListening = true;
                this.updateUI(true);
                console.log("🎤 Mic Started");
            };

            this.recognition.onend = () => {
                this.isListening = false;
                this.updateUI(false);
                console.log("🎤 Mic Stopped");

                // If we have a transcript (final or last captured interim), process it
                const text = (this.finalTranscript || this.lastSpokenText || '').trim();
                if (text !== '') {
                    // onend fires exactly once per listening session -- the
                    // right place to log one conversation entry
                    addConvoEntry('them', text);

                    // Cleanly close the speech listening overlay first
                    this.toggleOverlay(false);

                    // Sequential flow: Wait for speech session to fully finish and close,
                    // then show and play the avatar sign translation
                    setTimeout(() => {
                        tryAutoPlayAvatarReply(text);
                    }, 350);
                } else {
                    this.toggleOverlay(false);
                    const incomingDisplay = document.getElementById('incoming-text');
                    if (incomingDisplay) incomingDisplay.style.display = 'none';
                }
            };

            this.recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalPart = '';

                for (let i = 0; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalPart += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                this.finalTranscript = finalPart.trim();
                this.lastSpokenText = (this.finalTranscript || interimTranscript).trim();

                // Update Overlay Text
                const transcriptDisplay = document.getElementById('active-transcript');
                if (transcriptDisplay) {
                    transcriptDisplay.innerHTML = `
                        <span style="color:white;">${this.finalTranscript}</span>
                        <span style="color:rgba(255,255,255,0.6);">${interimTranscript}</span>
                    `;
                }

                // Update original Dashboard Text 
                const incomingDisplay = document.getElementById('incoming-text');
                if (incomingDisplay && this.lastSpokenText) {
                    incomingDisplay.style.setProperty('display', 'block', 'important');
                    incomingDisplay.innerText = this.lastSpokenText;
                }

                console.log("🗣️ Speech captured:", this.lastSpokenText);
            };

            this.recognition.onerror = (event) => {
                console.error("❌ Speech Error:", event.error);
                let msg = "Error occurred";
                if (event.error === 'no-speech') msg = "No speech detected. Try again.";
                if (event.error === 'network') msg = "Network error. Check connection.";
                if (event.error === 'not-allowed') msg = "Microphone access denied.";

                const title = document.getElementById('listening-title');
                if (title) title.innerText = msg;

                // Keep overlay for a moment to show error
                setTimeout(() => {
                    if (this.isListening) this.stopListening();
                    this.toggleOverlay(false);
                }, 2000);
            };
        },

        startListening: function () {
            if (!this.recognition) return;
            if (this.isListening) return;

            // Close any active avatar video so speaking and avatar never run simultaneously
            closeAvatarPip();

            this.finalTranscript = ''; // Reset
            this.lastSpokenText = ''; // Reset

            // Set Language Logic
            let micLang = 'en-US';
            if (selectedLang === 'hindi') micLang = 'hi-IN';
            if (selectedLang === 'bengali') micLang = 'bn-IN';
            this.recognition.lang = micLang;
            console.log("🌐 Setting Mic Language to:", micLang);

            // Update user hint logic based on Polite Mode? -> No, standard recognition is fine.
            // Polite mode affects OUTPUT, not input recognition usually.

            this.toggleOverlay(true);
            try {
                this.recognition.start();
            } catch (e) { console.error(e); }
        },

        stopListening: function () {
            if (!this.recognition) return;
            this.recognition.stop();
        },

        toggleListening: function () {
            if (this.isListening) {
                this.stopListening();
            } else {
                this.startListening();
            }
        },

        toggleOverlay: function (show) {
            const overlay = document.getElementById('listening-overlay');
            const title = document.getElementById('listening-title');
            const transcript = document.getElementById('active-transcript');

            if (overlay) {
                if (show) {
                    overlay.classList.add('active');
                    if (title) title.innerText = "Listening...";
                    if (transcript) transcript.innerText = "";
                } else {
                    overlay.classList.remove('active');
                }
            }
        },

        updateUI: function (active) {
            const listenBtn = document.getElementById('listen-btn');
            if (listenBtn) {
                if (active) {
                    listenBtn.classList.add('listening');
                    listenBtn.innerHTML = '<i class="fas fa-wave-square"></i> &nbsp; Listening...';
                } else {
                    listenBtn.classList.remove('listening');
                    listenBtn.innerHTML = '<i class="fas fa-microphone"></i> &nbsp; Listen to Reply';
                }
            }
        }
    };


    // --- INIT ---
    document.addEventListener('DOMContentLoaded', () => {
        // 0. Sync Language State
        const langSelect = document.getElementById('language-select');
        if (langSelect) selectedLang = langSelect.value;

        // 1. Socket Init
        if (typeof io !== 'undefined') {
            socket = io();

            socket.on('connect', () => {
                console.log("⚡ Connected to Server via WebSockets");
                emitSettings();
                setConnectionStatus('connected');
            });

            socket.on('disconnect', () => {
                console.log("🔌 Disconnected");
                setConnectionStatus('disconnected');
            });

            socket.on('prediction_update', (data) => {
                const predElement = document.getElementById('pred-text');
                const sentElement = document.getElementById('sent-text');
                const ringFill = document.getElementById('ring-fill');
                const ringPct = document.getElementById('ring-pct');

                if (data.prediction && data.prediction !== "Nothing") {
                    if (predElement) {
                        predElement.innerText = data.prediction;
                        // Retrigger the settle animation on every new word, even
                        // back-to-back ones, rather than an abrupt text swap.
                        predElement.classList.remove('pred-updated');
                        void predElement.offsetWidth; // force reflow so the animation restarts
                        predElement.classList.add('pred-updated');
                    }
                    if (sentElement) sentElement.innerText = data.sentence;

                    // Confidence ring -- real model.predict_proba() output, not a
                    // decorative animation. Same high/mid/low color language as
                    // the caregiver dashboard's feed.
                    if (ringFill && ringPct) {
                        const circumference = 119.4;
                        const conf = data.confidence;
                        if (conf === null || conf === undefined) {
                            ringFill.style.strokeDashoffset = String(circumference);
                            ringPct.textContent = '';
                            ringFill.classList.remove('conf-mid', 'conf-low');
                        } else {
                            ringFill.style.strokeDashoffset = String(circumference * (1 - conf));
                            ringPct.textContent = Math.round(conf * 100) + '%';
                            ringFill.classList.toggle('conf-mid', conf < 0.75 && conf >= 0.5);
                            ringFill.classList.toggle('conf-low', conf < 0.5);
                        }
                    }

                    document.querySelectorAll('.gesture-icon').forEach(el => el.classList.remove('active'));
                    const activeIcon = document.getElementById('icon-' + data.prediction);
                    if (activeIcon) {
                        activeIcon.classList.add('active');
                        activeIcon.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }

                    // Bidirectional conversation log -- this fires only on a genuine
                    // new confirmed word (app.py's stabilization buffer already
                    // gates that), so one log entry per real signed word, not spam.
                    addConvoEntry('you', data.sentence || data.prediction);
                }
            });

            socket.on('play_audio', (data) => {
                if (data.audio_url) AppManager.playAudio(data.audio_url);
            });

            // Stage 3: Emergency Detector confirmation. "Fail loud, not silent" --
            // the signer should see that this was flagged and sent, not just
            // trust that a notification happened somewhere they can't see.
            socket.on('emergency_confirmed', (data) => {
                AppManager.showEmergencyConfirmation(data.trigger_phrase, data.severity);
            });

            // Backend returning drawn frames
            socket.on('processed_frame', (data) => {
                isFrameProcessing = false;
                if (frameWatchdogTimer) {
                    clearTimeout(frameWatchdogTimer);
                    frameWatchdogTimer = null;
                }
                if (isCameraOn) {
                    const img = document.getElementById('video_feed');
                    if (img) img.src = data;
                }
            });
        } else {
            console.error("❌ Socket.IO library failed to load");
            setConnectionStatus('disconnected');
        }

        // 2. Preload
        AppManager.preloadAudio();

        // 3. Permissions Check
        checkPermissions();

        // 4. Init Theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            toggleTheme(false); // Apply light without toggling
        }

        // 5. Init Speech
        SpeechManager.init();
    });

    function checkPermissions() {
        // Explicitly request front-facing camera on mobile. 
        // Do NOT request audio here! The Web Speech API needs exclusive access to the mic on mobile.
        // 4:3 ideal, kept modest on purpose: this whole frame gets base64-encoded,
        // sent to the server, decoded, run through MediaPipe, re-encoded, and
        // sent back -- every one of those steps costs roughly the pixel count.
        // 1280x960 was the first fix (for the crop bug) but made every round
        // trip ~4x more expensive than 640x480, which is the actual source of
        // the lag. MediaPipe's hand model doesn't need more than this to work
        // well -- it downsamples internally regardless of input size -- so this
        // is close to a pure latency win with no real accuracy cost. Same 4:3
        // ratio as before, so the crop fix (ratio + object-fit: contain) holds.
        navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'user',
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        })
            .then(stream => {
                console.log("✅ Camera Access Granted (Mic will be requested on-demand)");
                localStream = stream;
                const localVideo = document.getElementById('local_video');
                if (localVideo) {
                    localVideo.srcObject = stream;
                    localVideo.play();
                }

                startFrameStreaming();
            })
            .catch(err => {
                console.error("❌ Permission Denied:", err);
                const overlay = document.createElement('div');
                overlay.className = 'permission-blocked-overlay';
                overlay.innerHTML = `
                    <i class="fas fa-lock"></i>
                    <h1>Camera/Mic Access Blocked</h1>
                    <p>Please allow camera and microphone access.</p>
                    <button onclick="location.reload()">Try Again</button>
                `;
                document.body.appendChild(overlay);
            });
    }

    function startFrameStreaming() {
        const localVideo = document.getElementById('local_video');
        const hiddenCanvas = document.getElementById('hidden_canvas');
        if (!localVideo || !hiddenCanvas) return;

        const context = hiddenCanvas.getContext('2d');
        const MAX_WIDTH = 640;

        // Process frames carefully to avoid network congestion
        cameraInterval = setInterval(() => {
            if (isCameraOn && socket && socket.connected && localVideo.readyState >= 2 && !isFrameProcessing) {
                isFrameProcessing = true;

                // Watchdog: auto-reset isFrameProcessing if server doesn't respond within 300ms
                if (frameWatchdogTimer) clearTimeout(frameWatchdogTimer);
                frameWatchdogTimer = setTimeout(() => {
                    isFrameProcessing = false;
                }, 300);

                // Downscale resolution to max 640px width while preserving aspect ratio
                const vW = localVideo.videoWidth || 640;
                const vH = localVideo.videoHeight || 480;
                const targetW = Math.min(vW, MAX_WIDTH);
                const targetH = Math.round((vH / vW) * targetW);

                if (hiddenCanvas.width !== targetW || hiddenCanvas.height !== targetH) {
                    hiddenCanvas.width = targetW;
                    hiddenCanvas.height = targetH;
                }

                context.drawImage(localVideo, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

                // Compress highly: speed > quality for ML coordinates
                const dataURL = hiddenCanvas.toDataURL('image/jpeg', 0.45);
                socket.emit('video_frame', dataURL);
            }
        }, 80); // Send next frame roughly ~12fps max
    }

    function emitSettings() {
        if (!socket) return;
        const lang = document.getElementById('language-select')?.value || 'english';
        const polite = document.getElementById('polite-toggle')?.checked || false;
        socket.emit('update_settings', { lang: lang, polite: polite });
    }

    // --- UI Logic ---
    // Start Overlay Unlock
    document.getElementById('start-overlay')?.addEventListener('click', function () {
        this.classList.add('is-hiding');
        setTimeout(() => { this.style.display = 'none'; }, 500);
        new Audio().play().catch(e => { }); // Unlock Audio Context
    });

    // 1. Language Change (Refined with Pulse Animation)
    function onLanguageChange(select) {
        selectedLang = select.value;
        emitSettings();

        // Visual Pulse Effect
        select.classList.add('language-pulse');
        setTimeout(() => select.classList.remove('language-pulse'), 500);

        // Toast Notification (Optional but good for feedback)
        // console.log("🌐 Language Switched to:", selectedLang);

        // If listening, restart to apply new language
        if (SpeechManager.isListening) {
            SpeechManager.stopListening();
            setTimeout(() => SpeechManager.startListening(), 500);
        }
    }
    document.getElementById('language-select')?.addEventListener('change', (e) => onLanguageChange(e.target));


    // 2. Polite Toggle (Refined with Golden Glow)
    function togglePolite() {
        const checkbox = document.getElementById('polite-toggle');
        if (checkbox) {
            isPoliteMode = checkbox.checked;
            const wrapper = document.getElementById('polite-wrapper');

            if (wrapper) {
                if (isPoliteMode) {
                    wrapper.classList.add('active');
                    // Add a temporary scale bump
                    wrapper.style.transform = "scale(1.1)";
                    setTimeout(() => wrapper.style.transform = "scale(1.02)", 200);
                } else {
                    wrapper.classList.remove('active');
                    wrapper.style.transform = "scale(1)";
                }
            }
            emitSettings();
        }
    }

    // 3. Theme Toggle
    function toggleTheme(doToggle = true) {
        const body = document.body;
        const icon = document.getElementById('theme-icon');
        let isLight = body.getAttribute('data-theme') === 'light';

        if (doToggle) isLight = !isLight;

        if (isLight) {
            body.setAttribute('data-theme', 'light');
            if (icon) { icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); }
            localStorage.setItem('theme', 'light');
        } else {
            body.removeAttribute('data-theme');
            if (icon) { icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); }
            localStorage.setItem('theme', 'dark');
        }
    }

    // 4. Camera Toggle
    function toggleCamera() {
        const btn = document.getElementById('camera-toggle');
        const icon = btn ? btn.querySelector('i') : null;
        isCameraOn = !isCameraOn;

        if (isCameraOn) {
            if (icon) {
                icon.classList.remove('fa-video-slash');
                icon.classList.add('fa-video');
                btn.classList.remove('is-off');
            }
        } else {
            const videoFeed = document.getElementById('video_feed');
            if (videoFeed) {
                videoFeed.style.opacity = "0";
                setTimeout(() => { videoFeed.src = ""; }, 300);
            }
            if (icon) {
                icon.classList.remove('fa-video');
                icon.classList.add('fa-video-slash');
                btn.classList.add('is-off');
            }
        }
    }

    // 5. Sound Toggle
    function toggleSound() {
        const btn = document.getElementById('sound-toggle');
        const icon = btn ? btn.querySelector('i') : null;
        isMuted = !isMuted;
        if (isMuted) {
            if (icon) {
                icon.classList.remove('fa-volume-up');
                icon.classList.add('fa-volume-mute');
                btn.classList.add('is-off');
            }
        } else {
            if (icon) {
                icon.classList.remove('fa-volume-mute');
                icon.classList.add('fa-volume-up');
                btn.classList.remove('is-off');
            }
        }
    }

    // 6. Flashlight Toggle
    function toggleFlashlight() {
        const overlay = document.getElementById('flashlight-overlay');
        if (overlay) {
            overlay.style.display = (overlay.style.display === 'flex') ? 'none' : 'flex';
        }
        fetch('/log_event?msg=FlashlightToggled');
    }

    // 7. Toggle Listening (Main Function)
    function toggleListening() {
        SpeechManager.toggleListening();
    }

    // 7b. "Show Sign" tab -- switches the reply panel between speech-to-text
    // and pre-recorded real-signer avatar replies. Two panels, one active.
    function switchReplyTab(which) {
        const tabs = { listen: document.getElementById('tab-listen'), avatar: document.getElementById('tab-avatar') };
        const panels = { listen: document.getElementById('panel-listen'), avatar: document.getElementById('panel-avatar') };
        Object.keys(tabs).forEach((key) => {
            const isActive = key === which;
            tabs[key].classList.toggle('is-active', isActive);
            tabs[key].setAttribute('aria-selected', isActive ? 'true' : 'false');
            panels[key].hidden = !isActive;
        });
        // Leaving the avatar tab mid-playback shouldn't leave audio/video
        // running invisibly in the background.
        if (which !== 'avatar') {
            const video = document.getElementById('avatar-video');
            if (video && !video.paused) video.pause();
        }
    }

    // 7c. Speech -> Avatar matching. Word-overlap scoring against each
    // reply's trigger phrases (avatar_replies.py). Deliberately NOT an
    // embedding/LLM-based matcher: with a fixed, closed set of known
    // target phrases, a heavier model buys no real accuracy but adds real
    // latency (a network round trip at minimum). This runs in microseconds,
    // entirely client-side, off the transcript SpeechManager already has.
    // If nothing matches confidently, this does nothing -- the existing
    // raw-text behavior is exactly what the patient sees. Never force a
    // match onto a wrong sign just because it was the closest of ten.
    const AVATAR_MATCH_THRESHOLD = 0.5;
    // Common function words carry no topic-specific meaning and cause false
    // positives on short triggers -- e.g. without this, "can you tell me
    // your date of birth" matched the "repeat" reply, because its trigger
    // "can you repeat" shares "can"/"you" with almost any question. Filtered
    // out of both sides before scoring, found and fixed via direct testing
    // against adversarial phrases, not assumed correct.
    const AVATAR_MATCH_STOP_WORDS = new Set([
        'a', 'an', 'the', 'is', 'are', 'was', 'were', 'do', 'does', 'did', 'can', 'could',
        'would', 'should', 'will', 'you', 'your', 'me', 'my', 'i', 'it', 'that', 'this',
        'please', 'to', 'of', 'in', 'on', 'at', 'and', 'or', 'be', 'been', 'have', 'has',
        'had', 'not', 'so', 'just', 'there', 'here',
    ]);

    function normalizeForMatch(s) {
        return (s || '').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
    }

    function avatarMatchContentWords(s) {
        return normalizeForMatch(s).split(' ').filter((w) => w && !AVATAR_MATCH_STOP_WORDS.has(w));
    }

    function triggerMatchScore(transcript, triggerPhrase) {
        const normT = normalizeForMatch(transcript);
        const normP = normalizeForMatch(triggerPhrase);
        if (!normT || !normP) return 0;

        // Exact match or full phrase containment gives high confidence
        if (normT === normP) return 1.0;
        if (normT.includes(normP) || normP.includes(normT)) return 0.9;

        const tWords = new Set(avatarMatchContentWords(transcript));
        const pWords = avatarMatchContentWords(triggerPhrase);
        if (pWords.length === 0 || tWords.size === 0) return 0;
        const matched = pWords.filter((w) => tWords.has(w)).length;
        return matched / pWords.length; // fraction of the trigger phrase's meaningful words actually said
    }

    function findAvatarMatch(transcript) {
        if (!window.AVATAR_REPLIES || !transcript) return null;
        let bestKey = null;
        let bestScore = 0;
        window.AVATAR_REPLIES.forEach((reply) => {
            (reply.triggers || []).forEach((trigger) => {
                const score = triggerMatchScore(transcript, trigger);
                if (score > bestScore) {
                    bestScore = score;
                    bestKey = reply.key;
                }
            });
        });
        console.log("🎯 Avatar Match Check for:", transcript, "-> Matched Key:", bestKey, "Score:", bestScore);
        return bestScore >= AVATAR_MATCH_THRESHOLD ? bestKey : null;
    }

    // Called from SpeechManager.onend with the raw transcript (already
    // logged to the conversation by that point). Returns true if it found
    // and played a confident match, so the caller knows whether anything
    // extra happened.
    function tryAutoPlayAvatarReply(transcript) {
        const key = findAvatarMatch(transcript);
        if (!key) {
            console.log("ℹ️ No avatar reply matched for transcript:", transcript);
            return false;
        }
        const btn = document.querySelector(`.avatar-reply-btn[data-key="${key}"]`);
        // Matched an intent, but no recording exists for it yet (see
        // avatar_replies.py) -- do nothing rather than fail or play the
        // wrong clip. The transcript is already shown as text either way.
        if (!btn || btn.disabled) {
            console.warn("⚠️ Avatar button disabled or not found for:", key);
            return false;
        }

        console.log("🎬 Playing avatar reply for:", key);
        switchReplyTab('avatar');
        playAvatarReply(btn, { logEntry: false, autoReturnToListen: true });
        return true;
    }

    function closeAvatarPip() {
        const pip = document.getElementById('avatar-pip');
        const video = document.getElementById('avatar-video');
        if (video && !video.paused) video.pause();
        if (pip) pip.classList.remove('is-active', 'is-playing');
    }

    // 7d. Play a pre-recorded avatar reply on the large HD stage PiP.
    function playAvatarReply(btn, options = {}) {
        // Stop any active mic listening session before starting avatar playback
        if (SpeechManager.isListening) {
            SpeechManager.stopListening();
            SpeechManager.toggleOverlay(false);
        }

        const logEntry = options.logEntry !== false; // default true (manual taps log)
        const autoReturnToListen = options.autoReturnToListen === true; // default false

        const pip = document.getElementById('avatar-pip');
        const video = document.getElementById('avatar-video');
        const caption = document.getElementById('avatar-caption');
        if (!video || !caption) return;

        const label = btn.dataset.label;
        const src = btn.dataset.video;
        const poster = btn.dataset.poster;

        document.querySelectorAll('.avatar-reply-btn').forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        caption.textContent = label;

        if (pip) pip.classList.add('is-active', 'is-playing');

        if (video.getAttribute('src') !== src) {
            video.src = src;
            if (poster) video.poster = poster;
            video.load();
        }
        video.muted = true;
        video.playsInline = true;
        video.currentTime = 0;
        const playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.catch((e) => console.warn('⚠️ Avatar video playback blocked on mobile:', e));
        }

        // Logged the moment playback starts
        if (logEntry) addConvoEntry('them', label);

        video.onended = () => {
            btn.classList.remove('is-active');
            if (pip) pip.classList.remove('is-playing');
            // Auto hide PiP after a brief pause so resting pose is seen clearly
            setTimeout(() => {
                if (pip && !pip.classList.contains('is-playing')) {
                    pip.classList.remove('is-active');
                }
            }, 1800);

            if (autoReturnToListen) switchReplyTab('listen');
        };
    }

    // 8. Play Gesture (Manual)
    function playGesture(gestureName) {
        const langSelect = document.getElementById('language-select');
        if (langSelect) selectedLang = langSelect.value;

        console.log("👆 Manual Gesture Click:", gestureName, "Lang:", selectedLang);

        let folder = selectedLang;
        let filename = gestureName.toLowerCase().replace(/ /g, '_');

        if (isPoliteMode) {
            folder += '_polite';
            filename += '_polite';
        }

        const url = `/static/audio/${folder}/${filename}.mp3`;
        AppManager.playAudio(url);

        // Visual Feedback
        const iconId = 'icon-' + gestureName;
        const icon = document.getElementById(iconId);
        if (icon) {
            icon.classList.add('active');
            setTimeout(() => icon.classList.remove('active'), 1000);
        }
        const predText = document.getElementById('pred-text');
        if (predText) {
            predText.innerText = gestureName;
            predText.classList.remove('pred-updated');
            void predText.offsetWidth;
            predText.classList.add('pred-updated');
        }
        // Manual selection is a deliberate, certain action -- show the ring
        // full and green rather than leaving it at whatever the camera last
        // measured, which would misleadingly read as a low-confidence guess.
        const ringFill = document.getElementById('ring-fill');
        const ringPct = document.getElementById('ring-pct');
        if (ringFill && ringPct) {
            ringFill.style.strokeDashoffset = '0';
            ringFill.classList.remove('conf-mid', 'conf-low');
            ringPct.textContent = '✓';
        }

        // A manual tap is just as much a real communication act as a
        // recognized sign -- it belongs in the conversation log too.
        addConvoEntry('you', gestureName);
    }

    // --- Real connection status, replacing the previous hardcoded "ACTIVE"
    // badge. "Fail loud, not silent": if the socket drops, the signer should
    // see that, not keep watching a badge that lied about it. ---
    function setConnectionStatus(state) {
        const badge = document.getElementById('status-badge');
        const text = document.getElementById('status-text');
        if (!badge || !text) return;
        if (state === 'connected') {
            badge.classList.remove('is-down');
            text.textContent = 'ACTIVE';
        } else {
            badge.classList.add('is-down');
            text.textContent = 'RECONNECTING';
        }
    }

    // --- Conversation log: appends one entry to the bidirectional thread.
    // role is 'you' (signed/tapped) or 'them' (spoken reply, via SpeechManager).
    function addConvoEntry(role, text) {
        if (!text || !text.trim()) return;
        const log = document.getElementById('convo-log');
        if (!log) return;

        const empty = document.getElementById('convo-empty');
        if (empty) empty.remove();

        const entry = document.createElement('div');
        entry.className = 'convo-entry convo-' + role;

        const roleEl = document.createElement('span');
        roleEl.className = 'convo-role';
        roleEl.textContent = role === 'you' ? 'You' : 'Them';

        const textEl = document.createElement('span');
        textEl.className = 'convo-text';
        textEl.textContent = text; // textContent, not innerHTML -- no injection risk from speech input

        const timeEl = document.createElement('span');
        timeEl.className = 'convo-time';
        timeEl.textContent = new Date().toLocaleTimeString('en-GB', { hour12: false });

        entry.appendChild(roleEl);
        entry.appendChild(textEl);
        entry.appendChild(timeEl);
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;

        // Cap history so a long session doesn't grow the DOM without bound.
        const entries = log.querySelectorAll('.convo-entry');
        if (entries.length > 100) entries[0].remove();

        const countEl = document.getElementById('convo-count');
        if (countEl) countEl.textContent = String(log.querySelectorAll('.convo-entry').length);

        requestAnimationFrame(() => entry.classList.add('convo-entry-in'));
    }
</script>
